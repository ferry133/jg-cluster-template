---
version: '3'

set: [pipefail]
shopt: [globstar]

vars:
  BOOTSTRAP_DIR: '{{.ROOT_DIR}}/bootstrap'
  KUBERNETES_DIR: '{{.ROOT_DIR}}/kubernetes'
  SCRIPTS_DIR: '{{.ROOT_DIR}}/scripts'
  TALOS_DIR: '{{.ROOT_DIR}}/talos'
  TALOSCONFIG: '{{.ROOT_DIR}}/talos/clusterconfig/talosconfig'

env:
  KUBECONFIG: '{{.ROOT_DIR}}/kubeconfig'
  SOPS_AGE_KEY_FILE: '{{.ROOT_DIR}}/age.key'
  TALOSCONFIG: '{{.TALOSCONFIG}}'

includes:
  bootstrap: .taskfiles/bootstrap
  talos: .taskfiles/talos
  template: .taskfiles/template

tasks:

  default: task --list

  # The customer reads README-zero-IT.md on paper: when they read it the network
  # is not up yet, so a URL is not an entry point at that moment. Paper and
  # Markdown must therefore come from one source (CLAUDE.md), never transcribed.
  #
  # NOT wired into `task configure`, deliberately. A repo that never ships a box
  # has no reason to hold a build, and a check that fails on every such repo is
  # the permanently-red row this project already paid for once. It belongs in
  # the shipping flow — factory-agent §7 — where a box is actually being packed.
  print-zero-it:
    desc: Build the printable customer sheet from README-zero-IT.md
    cmd: python3 {{.SCRIPTS_DIR}}/build-zero-it-print.py {{.CLI_ARGS}}
    preconditions:
      - test -f {{.SCRIPTS_DIR}}/build-zero-it-print.py

  check-zero-it-print:
    desc: Assert the printable sheet exists and matches README-zero-IT.md
    cmd: python3 {{.SCRIPTS_DIR}}/build-zero-it-print.py --check
    preconditions:
      - test -f {{.SCRIPTS_DIR}}/build-zero-it-print.py

  test:
    desc: Run the scripts/ unit tests (stdlib unittest; no dependencies)
    # Tracked and runnable from a fresh clone, on purpose. §3's tests were
    # written, passed and never committed, so 3.2-3.7's checkmarks rested on a
    # run nobody else could reproduce — the same shape as a `.gitignore` that
    # exists only on the workstation doing the verifying.
    #
    # PROVISION_LIVE_TESTS=1 additionally runs the observers that talk to
    # GitHub. They are skipped by default so the suite runs offline; skipped is
    # not passed, and they are what caught the `deleted_at` regression.
    cmd: python3 -m unittest discover -s {{.SCRIPTS_DIR}}/tests {{.CLI_ARGS}}
    preconditions:
      - test -d {{.SCRIPTS_DIR}}/tests

  reconcile:
    desc: Force Flux to pull in changes from your Git repository
    cmd: flux --namespace flux-system reconcile kustomization flux-system --with-source
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which flux
